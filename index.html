<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Some Quotes</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 30px;
        }

        #quote {
            font-size: 28px;
            line-height: 1.5;
            color: #333;
        }

        .loading {
            color: #888;
        }

        .error {
            color: #c0392b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>The Quote</h1>

        <p id="quote" class="loading">Loading...</p>
    </div>

    <script>
        async function loadQuote() {
            const quoteElement = document.getElementById("quote");

            try {
                const response = await fetch("/api/quote", {
                    method: "GET",
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error("Failed to load quote");
                }

                const data = await response.json();

                quoteElement.textContent = data.quote || "Testing";
                quoteElement.className = "";
            } catch (error) {
                console.error(error);

                quoteElement.textContent = "Unable to load the quote.";
                quoteElement.className = "error";
            }
        }

        loadQuote();
    </script>

</body>
</html>
